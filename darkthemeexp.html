<!DOCTYPE html>
<html>
<head>
    <title>Dark Mode Toggle</title>

    <style>
        body {
            background-color: white;
            color: black;
            font-family: Arial;
            text-align: center;
            padding-top: 50px;
            transition: 0.3s;
        }

        .dark-mode {
            background-color: black;
            color: white;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Dark Mode Toggle</h1>
    <button onclick="toggleMode()">Toggle Dark Mode</button>

    <script>
        function toggleMode() {
            document.body.classList.toggle("dark-mode");
        }
    </script>

</body>
</html>
